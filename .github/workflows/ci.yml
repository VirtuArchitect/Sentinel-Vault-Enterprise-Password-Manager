name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Verify SQLite storage mode
        if: matrix.node-version == 24
        run: SQLITE_PATH="${RUNNER_TEMP}/sentinel-vault-ci.sqlite" pnpm test:sqlite

      - name: Validate release evidence templates
        run: |
          pnpm validate:connector-evidence docs/templates/connector-certification-evidence.json
          pnpm validate:deployment-evidence docs/templates/deployment-evidence-bundle.json
          pnpm validate:browser-rollout docs/templates/browser-extension-rollout-evidence.json
          pnpm validate:kms-hsm-evidence docs/templates/kms-hsm-provider-evidence.json
          pnpm validate:identity-evidence docs/templates/identity-provider-evidence.json
          pnpm validate:windows-release docs/templates/windows-release-evidence.json
          pnpm release:provenance -- --out "${RUNNER_TEMP}/release-provenance.json"
          node -e "import('./src/server/data/seedData.mjs').then(({ createSeedState }) => { const { sessions, loginFailures, ...state } = createSeedState(); require('node:fs').writeFileSync(process.argv[1], JSON.stringify({ ...state, metadata: { version: 2 } }, null, 2)); })" "${RUNNER_TEMP}/sentinel-state.json"
          pnpm plan:postgres -- --state "${RUNNER_TEMP}/sentinel-state.json" --out "${RUNNER_TEMP}/postgres-migration-plan.json"

      - name: Validate deployment readiness tooling
        run: |
          pnpm prepare:deployment-evidence -- --environment "ci" --owner "CI" --out-dir "${RUNNER_TEMP}/deployment-evidence"
          pnpm report:external-evidence -- --environment "ci" --owner "CI" --out "${RUNNER_TEMP}/deployment-evidence/external-evidence-requests.json" --markdown-out "${RUNNER_TEMP}/deployment-evidence/external-evidence-requests.md"
          pnpm validate:external-evidence -- --requests "${RUNNER_TEMP}/deployment-evidence/external-evidence-requests.json" --strict
          pnpm report:deployment-evidence -- --bundle "${RUNNER_TEMP}/deployment-evidence/deployment-evidence-bundle.json" --out "${RUNNER_TEMP}/deployment-evidence/deployment-evidence-status.json"
          pnpm report:phase-readiness -- --bundle "${RUNNER_TEMP}/deployment-evidence/deployment-evidence-bundle.json" --external-requests "${RUNNER_TEMP}/deployment-evidence/external-evidence-requests.json" --out "${RUNNER_TEMP}/deployment-evidence/phase-readiness.json" --markdown-out "${RUNNER_TEMP}/deployment-evidence/phase-readiness.md"
          if pnpm report:phase-readiness -- --bundle "${RUNNER_TEMP}/deployment-evidence/deployment-evidence-bundle.json" --external-requests "${RUNNER_TEMP}/deployment-evidence/external-evidence-requests.json" --target "pilot" --fail-on-blockers > "${RUNNER_TEMP}/deployment-evidence/phase-readiness-gate.json"; then
            echo "Expected fail-on-blockers to reject placeholder deployment evidence"
            exit 1
          fi
          echo "fail-on-blockers rejected placeholder deployment evidence as expected"

      - name: Secret scan
        run: pnpm scan:secrets

      - name: Dependency audit
        run: pnpm audit --audit-level high
